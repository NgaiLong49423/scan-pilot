spring:
  application:
    name: scan-pilot-backend

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

scanpilot:
  auth:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/auth/github/callback}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    cookie-secure: ${COOKIE_SECURE:false}
    session-ttl-seconds: ${SESSION_TTL_SECONDS:604800}
    state-ttl-seconds: ${STATE_TTL_SECONDS:600}
  github:
    app-id: ${GITHUB_APP_ID:}
    app-slug: ${GITHUB_APP_SLUG:scan-pilot}
    app-private-key: ${GITHUB_APP_PRIVATE_KEY:}
  security:
    hmac-secret-key: ${SCANPILOT_HMAC_SECRET_KEY:default-insecure-dev-hmac-key-for-local-testing-only-32bytes}
  gitleaks:
    binary-path: ${GITLEAKS_BINARY_PATH:gitleaks}
    timeout-seconds: ${GITLEAKS_TIMEOUT_SECONDS:60}
    policy-resource-path: ${GITLEAKS_POLICY_PATH:policies/sp-config-001-gitleaks.toml}


