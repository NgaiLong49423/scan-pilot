spring:
  application:
    name: scan-pilot-backend

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

scanpilot:
  auth:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/auth/github/callback}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    cookie-secure: ${COOKIE_SECURE:false}
    session-ttl-seconds: ${SESSION_TTL_SECONDS:604800}
    state-ttl-seconds: ${STATE_TTL_SECONDS:600}

