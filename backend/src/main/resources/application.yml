spring:
  application:
    name: scan-pilot-backend
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:h2:mem:scanpilot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${JDBC_DATABASE_DRIVER:org.h2.Driver}
    username: ${JDBC_DATABASE_USERNAME:sa}
    password: ${JDBC_DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

scanpilot:
  cors:
    allowed-origins: ${SCANPILOT_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://aistudio.google.com}
  auth:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/auth/github/callback}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    cookie-secure: ${COOKIE_SECURE:false}
    session-ttl-seconds: ${SESSION_TTL_SECONDS:604800}
    state-ttl-seconds: ${STATE_TTL_SECONDS:600}
  github:
    app-id: ${GITHUB_APP_ID:}
    app-slug: ${GITHUB_APP_SLUG:scan-pilot}
    app-private-key: ${GITHUB_APP_PRIVATE_KEY:}
  security:
    hmac-secret-key: ${SCANPILOT_HMAC_SECRET_KEY:default-insecure-dev-hmac-key-for-local-testing-only-32bytes}
  gitleaks:
    binary-path: ${GITLEAKS_BINARY_PATH:gitleaks}
    timeout-seconds: ${GITLEAKS_TIMEOUT_SECONDS:180}
    policy-resource-path: ${GITLEAKS_POLICY_PATH:policies/sp-config-001-gitleaks.toml}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:15}
      enabled: ${GEMINI_ENABLED:true}
      cache-ttl-seconds: ${GEMINI_CACHE_TTL_SECONDS:3600}



