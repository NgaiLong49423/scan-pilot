spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:h2:mem:scanpilot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${JDBC_DATABASE_DRIVER:org.h2.Driver}
    username: ${JDBC_DATABASE_USERNAME:sa}
    password: ${JDBC_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      pool-name: ScanPilotProdHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

scanpilot:
  cors:
    allowed-origins: ${SCANPILOT_CORS_ALLOWED_ORIGINS:https://aistudio.google.com,https://*.ai.studio,https://*.run.app,http://localhost:3000,http://localhost:5173}
  auth:
    cookie-secure: ${COOKIE_SECURE:true}

logging:
  level:
    root: INFO
    com.scanpilot: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
