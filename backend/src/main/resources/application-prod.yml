spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

scanpilot:
  cors:
    allowed-origins: ${SCANPILOT_CORS_ALLOWED_ORIGINS:https://aistudio.google.com,https://*.ai.studio,https://*.run.app,http://localhost:3000,http://localhost:5173}
  auth:
    frontend-url: ${FRONTEND_URL:https://scan-pilot.ai.studio}
    cookie-secure: ${COOKIE_SECURE:true}
    redirect-uri: ${GITHUB_REDIRECT_URI:https://scan-pilot-api-drbjfwrlxq-as.a.run.app/api/v1/auth/github/callback}
  security:
    hmac-secret-key: ${SCANPILOT_HMAC_SECRET_KEY}

logging:
  level:
    root: INFO
    com.scanpilot: INFO
    org.springframework.web: INFO
    org.hibernate: WARN
